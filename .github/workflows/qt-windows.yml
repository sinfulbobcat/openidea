name: Qt Windows Build

on:
  push:
    branches: [port/cpp-c]
    paths:
      - ".github/workflows/qt-windows.yml"
      - "qt-rewrite/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (Qt 5 / MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5 and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: "tools_mingw,qt.tools.win64_mingw810"

      - name: Configure
        shell: bash
        run: cmake -S qt-rewrite -B qt-rewrite/build-win -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build qt-rewrite/build-win --config Release --parallel 2

      - name: Bundle application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "qt-rewrite/build-win"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "qt-rewrite/package"
          $executable = Join-Path $buildDir "openidea_qt_rewrite.exe"
          $packagedExecutable = Join-Path $packageDir "openidea_qt_rewrite.exe"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Force $executable $packagedExecutable
          $deployTool = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $deployTool --compiler-runtime $packagedExecutable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: openidea-qt-windows-x64
          path: qt-rewrite/package/
          if-no-files-found: error
          retention-days: 14
